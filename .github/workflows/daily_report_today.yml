name: SupplyNote Today Ingredients Report

on:
  workflow_dispatch:   # triggered by cron-job.org every 2 hours from 8 AM to 6 PM IST

jobs:
  download-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r github_action/requirements.txt

      - name: Install Playwright + Edge (fallback browser)
        run: |
          playwright install msedge
          playwright install-deps msedge

      - name: Write Google OAuth credentials from secrets
        run: |
          mkdir -p github_action/config
          echo "${{ secrets.GMAIL_TOKEN_JSON }}"       | base64 -di > github_action/config/token.json
          echo "${{ secrets.GMAIL_CREDENTIALS_JSON }}" | base64 -di > github_action/config/credentials.json

      - name: Run downloader (today's report)
        env:
          SUPPLYNOTE_USER:        ${{ secrets.SUPPLYNOTE_USER }}
          SUPPLYNOTE_PASS:        ${{ secrets.SUPPLYNOTE_PASS }}
          SUPPLYNOTE_BUSINESS_ID: ${{ secrets.SUPPLYNOTE_BUSINESS_ID }}
          EMAIL_USER:             ${{ secrets.EMAIL_USER }}
          RECIPIENT_EMAIL:        ${{ secrets.RECIPIENT_EMAIL_TODAY }}
          GMAIL_CREDENTIALS_PATH: github_action/config/credentials.json
          GMAIL_TOKEN_PATH:       github_action/config/token.json
          DOWNLOAD_TYPE:          all
          REPORT_DATE:            today
          REPORT_TITLE:           All Ingredients Data (Today's Report - Every 2 Hours Generated)
          SKIP_DRIVE_UPLOAD:      true
        run: |
          cd github_action
          python downloader.py
